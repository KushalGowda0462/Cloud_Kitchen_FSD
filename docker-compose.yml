services:
  mongodb:
    image: mongo:7
    container_name: cloudkitchen_mongo
    ports:
      - "27017:27017"
    volumes:
      - cloudkitchen_mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-express:
    image: mongo-express:1
    container_name: cloudkitchen_mongo_express
    ports:
      - "8083:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cloudkitchen_mongo_data:

